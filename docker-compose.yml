# BOBAI HR local development. Production configuration is outside this setup.
name: bobai-hr

x-app: &app
  image: bobai-hr:dev
  build: .
  env_file: .env
  environment: &app-env
    DJANGO_SETTINGS_MODULE: bobai.settings
    DEBUG: "True"
    DB_HOST: db
    DB_PORT: "5432"
    DATABASE_URL: postgres://${POSTGRES_USER:-bobai_hr}:${POSTGRES_PASSWORD:-bobai-local-db}@db:5432/${POSTGRES_DB:-bobai_hr}
    REDIS_URL: redis://:${REDIS_PASSWORD:-bobai-local-redis}@redis:6379/0
    ALLOWED_HOSTS: localhost,127.0.0.1
    CSRF_TRUSTED_ORIGINS: http://localhost:${WEB_PORT:-8000},http://127.0.0.1:${WEB_PORT:-8000}
    AXES_PROXY_COUNT: "0"
  volumes:
    - .:/app
    - media:/app/media
    - staticfiles:/app/staticfiles

services:
  web:
    <<: *app
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    environment:
      <<: *app-env
      GUNICORN_WORKERS: "1"
      GUNICORN_RELOAD: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/ready/"]
      interval: 10s
      timeout: 5s
      start_period: 600s
      retries: 12

  # Exactly one scheduler; web completes migrations before it starts.
  scheduler:
    <<: *app
    command: python manage.py run_scheduler
    environment:
      <<: *app-env
      HORILLA_SKIP_RELEASE_TASKS: "1"
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bobai_hr}
      POSTGRES_USER: ${POSTGRES_USER:-bobai_hr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bobai-local-db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-bobai-local-redis}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-bobai-local-redis}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  redis_data:
  media:
  staticfiles:
